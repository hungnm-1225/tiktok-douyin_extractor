<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#FF5388" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF2E93" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="7" y="7" width="86" height="86" rx="23" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Script Lines / Sound wave symbol -->
  <rect x="24" y="27" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.95" />
  <rect x="24" y="38" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
  <rect x="24" y="49" width="34" height="6" rx="3" fill="#FFFFFF" opacity="0.85" />

  <!-- Play Badge with Glow -->
  <circle cx="68" cy="66" r="18" fill="url(#neonCyan)" />
  <polygon points="63,57 77,66 63,75" fill="#FFFFFF" />

  <!-- Sparkle Star Accent -->
  <path d="M72 20 Q72 27 79 27 Q72 27 72 34 Q72 27 65 27 Q72 27 72 20 Z" fill="#FFE600" />
</svg>
